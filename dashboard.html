<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile Monitor</title><style>body{margin:0;background:#f6f7fb;color:#111827;font:14px Inter,Arial,sans-serif}.app{max-width:1040px;margin:0 auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}h1{font-size:28px;margin:0 0 8px}p{color:#64748b;margin:0}.badge{border:1px solid #c7d2fe;color:#5b21b6;background:#f5f3ff;padding:7px 10px;border-radius:7px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e2e8f0;border-radius:8px;padding:20px}.wide{grid-column:1/-1}h2{font-size:15px;margin:0 0 14px}input{height:40px;border:1px solid #cbd5e1;border-radius:6px;padding:0 12px;width:260px}button{height:40px;border:0;border-radius:6px;background:#6d28d9;color:white;font-weight:700;padding:0 16px;margin-left:8px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.target{display:flex;align-items:center;border-top:1px solid #eef2f7;padding:13px 0;gap:10px}.target b{flex:1}.status{font-size:12px;color:#64748b}.ok{color:#047857}.warn{color:#b45309}.empty{color:#94a3b8;padding:12px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meta div{background:#f8fafc;border-radius:6px;padding:12px}.meta b{display:block;margin-top:5px}.run{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#0f172a;color:#d1fae5;border-radius:6px;padding:14px;min-height:54px}</style></head><body><main class="app"><header><div><h1>Profile Monitor</h1><p>Controle local de rodadas manuais por perfil.</p></div><span class="badge">LOCAL</span></header><section class="grid"><div class="card"><h2>Configuração</h2><div class="meta" id="config"></div></div><div class="card"><h2>Nova referência</h2><input id="handle" placeholder="@perfil"><button onclick="addTarget()">Adicionar</button><p id="message" style="margin-top:12px"></p></div><div class="card wide"><h2>Perfis monitorados</h2><div id="targets"></div></div><div class="card wide"><h2>Última rodada</h2><div class="run" id="run">Nenhuma coleta solicitada.</div></div></section></main><script>let state={};async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let x=await r.json();if(!r.ok)throw Error(x.error||'Erro');return x}function yes(x){return x?'Configurado':'Pendente'}function show(){let c=state.configuration||{};config.innerHTML=`<div>Token interno<b class="${c.control_token?'ok':'warn'}">${yes(c.control_token)}</b></div><div>Conta coletora<b class="${c.collector_username&&c.collector_password?'ok':'warn'}">${yes(c.collector_username&&c.collector_password)}</b></div><div>Proxy<b class="${c.proxy?'ok':'warn'}">${yes(c.proxy)}</b></div><div>Estado<b>${state.connection?.status||'not_configured'}</b></div>`;targets.innerHTML=(state.targets||[]).length?(state.targets||[]).map(t=>`<div class="target"><b>@${t.handle}</b><span class="status">${t.collection_status}</span><button onclick="collect(${t.id})" ${state.run&&['requested','running'].includes(state.run.status)?'disabled':''}>Coletar agora</button></div>`).join(''):'<div class="empty">Adicione o primeiro perfil para preparar uma rodada manual.</div>';run.textContent=state.run?JSON.stringify(Object.fromEntries(Object.entries(state.run).filter(([k])=>k!=='token')),null,2):'Nenhuma coleta solicitada.'}async function refresh(){state=await api('/api/status');show()}async function addTarget(){try{await api('/api/targets',{method:'POST',body:JSON.stringify({handle:handle.value})});handle.value='';message.textContent='Perfil adicionado.';await refresh()}catch(e){message.textContent=e.message}}async function collect(id){try{await api(`/api/targets/${id}/collect`,{method:'POST',body:'{}'});await refresh()}catch(e){message.textContent=e.message}}refresh();setInterval(refresh,3000)</script></body></html>
